<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latxa-Omni Interface</title>
    <style>
        /* Add your beautiful, custom CSS here */
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .mic-button { background-color: #4F46E5; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .recording { background-color: #EF4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🗣️ Latxa-Omni</h2>
    <p id="status">Click to start listening...</p>
    <button id="micBtn" class="mic-button">Start Microphone</button>
    <br><br>
    <audio id="audioPlayer" controls autoplay hidden></audio>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioContext;
    let analyser;
    let silenceTimer;
    
    const SILENCE_THRESHOLD = 10; // Adjust based on background noise
    const SILENCE_DURATION = 1500; // 1.5 seconds of silence triggers the send

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const audioPlayer = document.getElementById('audioPlayer');

    micBtn.addEventListener('click', async () => {

        if (!audioPlayer.paused) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0; 
        }
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            // Push data if it exists
            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) {
                    audioChunks.push(e.data);
                }
            };
            
            mediaRecorder.onstop = sendAudioToServer;

            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            
            // The '250' forces the recorder to emit data every 250ms
            mediaRecorder.start(250); 
            
            micBtn.classList.add('recording');
            micBtn.innerText = "Listening...";
            statusText.innerText = "Speak now. I will automatically send when you stop.";
            
            detectSilence();
        } catch (err) {
            console.error("Microphone access denied or unavailable:", err);
            statusText.innerText = "Error: Cannot access microphone. Are you using HTTPS/localhost?";
        }
    });

    async function sendAudioToServer() {
        // Browsers natively record in webm/ogg, not standard wav.
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
        console.log(`Sending audio payload. Size: ${audioBlob.size} bytes`);

        if (audioBlob.size === 0) {
            statusText.innerText = "Error: Captured audio was empty.";
            return;
        }

        const formData = new FormData();
        // Send it with a .webm extension so the backend knows what it is
        formData.append("audio", audioBlob, "input.webm");

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) throw new Error(`Server returned ${response.status}`);

            const responseBlob = await response.blob();
            const audioUrl = URL.createObjectURL(responseBlob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.hidden = false;
            
            micBtn.innerText = "Start Microphone";
            statusText.innerText = "Response received!";
            audioContext.close();
        } catch (error) {
            console.error("Error connecting to server:", error);
            statusText.innerText = "Error connecting to server. Check console.";
            micBtn.classList.remove('recording');
            micBtn.innerText = "Try Again";
        }
    }
    function detectSilence() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        const checkVolume = () => {
            if (mediaRecorder.state === "inactive") return;
            
            analyser.getByteFrequencyData(dataArray);
            const volume = dataArray.reduce((a, b) => a + b) / bufferLength;

            if (volume < SILENCE_THRESHOLD) {
                if (!silenceTimer) {
                    silenceTimer = setTimeout(() => {
                        mediaRecorder.stop();
                        micBtn.classList.remove('recording');
                        micBtn.innerText = "Processing...";
                        statusText.innerText = "Thinking...";
                    }, SILENCE_DURATION);
                }
            } else {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }
            requestAnimationFrame(checkVolume);
        };
        checkVolume();
    }
</script>
</body>
</html>
